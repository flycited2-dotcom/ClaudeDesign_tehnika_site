<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Войти · CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    /* Reset for standalone page */
    html, body {
      height: 100%;
      margin: 0;
    }

    /* ── Login shell: two-column full-viewport ── */
    .login-shell {
      display: grid;
      grid-template-columns: 480px 1fr;
      min-height: 100vh;
    }

    /* ── Left panel ── */
    .login-left {
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 40px 48px;
      position: relative;
      z-index: 1;
    }
    .login-wordmark {
      flex-shrink: 0;
    }
    .login-wordmark-name {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1;
    }
    .login-wordmark-sub {
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Center the form vertically */
    .login-form-wrap {
      flex: 1;
      display: flex;
      align-items: center;
    }
    .login-form {
      width: 100%;
    }

    .login-form-heading {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .login-form-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .login-field-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
    .login-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .login-label {
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text-muted);
    }
    .login-password-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .login-forgot {
      font-size: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: color var(--dur-fast) var(--ease-spring);
    }
    .login-forgot:hover { color: var(--accent); }

    .login-checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .login-checkbox-row input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .login-checkbox-row label {
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
    }

    .login-submit {
      width: 100%;
      height: 44px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .login-proto-note {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    /* ── Right panel ── */
    .login-right {
      background: linear-gradient(135deg, var(--accent-soft) 0%, var(--bg-app) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      position: relative;
    }
    .login-right::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
      opacity: 0.04;
      pointer-events: none;
    }
    /* Additional decorative radial blobs */
    .login-right::after {
      content: "";
      position: absolute;
      top: -80px;
      right: -80px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(31,74,58,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-quote-block {
      max-width: 480px;
      position: relative;
      z-index: 1;
    }
    /* Decorative quotation mark */
    .login-quote-mark {
      font-family: var(--font-serif);
      font-size: 80px;
      line-height: 0.6;
      color: var(--accent);
      opacity: 0.15;
      margin-bottom: 16px;
      display: block;
    }
    .login-quote {
      font-family: var(--font-serif);
      font-size: 36px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 20px;
    }
    .login-quote-sub {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .login-right-divider {
      width: 40px;
      height: 2px;
      background: var(--border-strong);
      margin-bottom: 16px;
      border-radius: var(--radius-pill);
    }
    .login-right-version {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    /* ── Responsive: collapse to single column on small screens ── */
    @media (max-width: 860px) {
      .login-shell {
        grid-template-columns: 1fr;
      }
      .login-right {
        display: none;
      }
      .login-left {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-shell">

    <!-- Left: form -->
    <div class="login-left">
      <div class="login-wordmark">
        <div class="login-wordmark-name">CRM</div>
        <div class="login-wordmark-sub">ТД Северное Сияние</div>
      </div>

      <div class="login-form-wrap">
        <div class="login-form">
          <h1 class="login-form-heading">Войти в CRM</h1>
          <p class="login-form-subtitle">Введите рабочую почту и пароль</p>

          <div class="login-field-group">
            <div class="login-field">
              <label class="login-label" for="login-email">Email</label>
              <input
                id="login-email"
                class="input"
                type="email"
                placeholder="name@company.ru"
                autocomplete="email"
              >
            </div>

            <div class="login-field">
              <div class="login-password-row">
                <label class="login-label" for="login-password">Пароль</label>
                <button class="login-forgot" type="button" tabindex="-1">Забыли пароль?</button>
              </div>
              <input
                id="login-password"
                class="input"
                type="password"
                placeholder="••••••••"
                autocomplete="current-password"
              >
            </div>
          </div>

          <div class="login-checkbox-row">
            <input type="checkbox" id="login-remember">
            <label for="login-remember">Запомнить меня</label>
          </div>

          <button
            class="btn btn-primary login-submit"
            id="login-btn"
            type="button"
          >
            Войти
          </button>

          <p class="login-proto-note">v0.1 · прототип, не для боевой эксплуатации</p>
        </div>
      </div>
    </div>

    <!-- Right: quote panel -->
    <div class="login-right">
      <div class="login-quote-block">
        <span class="login-quote-mark">"</span>
        <p class="login-quote">Ни одна заявка не теряется. Один интерфейс для всей команды.</p>
        <p class="login-quote-sub">Управленческий контур поверх 1С</p>
        <div class="login-right-divider"></div>
        <div class="login-right-version">CRM v0.1</div>
      </div>
    </div>

  </div>

  <script>
    document.getElementById('login-btn').addEventListener('click', function () {
      localStorage.setItem('crm.role', 'owner');
      location.href = '/app/dashboard-owner.html';
    });
  </script>
</body>
</html>
