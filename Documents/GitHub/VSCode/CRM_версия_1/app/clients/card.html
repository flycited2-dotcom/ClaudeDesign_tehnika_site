<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Клиент · CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-route="clients" data-title="Клиент">
  <div class="app-shell">
    <div data-shell="sidebar"></div>
    <main class="app-main">
      <div data-shell="topbar"></div>
      <div class="app-content">

        <!-- Entity header (replaces .app-header) -->
        <header class="entity-header" id="entity-header">
          <div class="entity-header-main">
            <div id="entity-avatar"></div>
            <div class="entity-id-block">
              <div class="entity-meta" id="entity-meta"></div>
              <h1 class="h-display" id="entity-name" style="font-size:32px;margin-top:4px;"></h1>
              <div class="entity-sub" id="entity-sub"></div>
            </div>
          </div>
          <div class="entity-header-actions">
            <button class="btn btn-ghost btn-icon" aria-label="Ещё"><i data-lucide="more-horizontal"></i></button>
            <button class="btn btn-secondary"><i data-lucide="edit-3"></i>Редактировать</button>
          </div>
        </header>

        <!-- Two-column body -->
        <div class="entity-body">

          <!-- LEFT: tabs + panels -->
          <div>
            <div id="tab-bar"></div>

            <!-- TAB: Общее -->
            <section data-tab-panel="general" style="margin-top:var(--space-6);">
              <div class="card kv-grid" id="panel-general-kv"></div>
              <div class="card" id="panel-general-tags" style="margin-top:var(--space-4);"></div>
              <div class="card" id="panel-general-notes" style="margin-top:var(--space-4);">
                <div class="card-head"><span class="card-head-title">Заметки</span></div>
                <p class="text-muted" style="font-size:13px;">Заметок пока нет.</p>
              </div>
            </section>

            <!-- TAB: Контакты -->
            <section data-tab-panel="contacts" style="margin-top:var(--space-6);display:none;">
              <div class="card-flush" id="panel-contacts"></div>
            </section>

            <!-- TAB: Сделки -->
            <section data-tab-panel="deals" style="margin-top:var(--space-6);display:none;">
              <div class="card-flush" id="panel-deals"></div>
            </section>

            <!-- TAB: КП -->
            <section data-tab-panel="offers" style="margin-top:var(--space-6);display:none;">
              <div class="card-flush" id="panel-offers"></div>
            </section>

            <!-- TAB: Задачи -->
            <section data-tab-panel="tasks" style="margin-top:var(--space-6);display:none;">
              <div class="card-flush" id="panel-tasks"></div>
            </section>

            <!-- TAB: Сообщения -->
            <section data-tab-panel="messages" style="margin-top:var(--space-6);display:none;">
              <div class="card" id="panel-messages"></div>
            </section>

            <!-- TAB: Файлы -->
            <section data-tab-panel="files" style="margin-top:var(--space-6);display:none;">
              <div class="card" id="panel-files"></div>
            </section>

            <!-- TAB: История -->
            <section data-tab-panel="history" style="margin-top:var(--space-6);display:none;">
              <div class="card" id="panel-history"></div>
            </section>
          </div>

          <!-- RIGHT RAIL -->
          <aside class="entity-rail">
            <!-- Quick actions -->
            <div class="card">
              <div class="card-head" style="margin-bottom:var(--space-3);">
                <span class="card-head-title">Быстрые действия</span>
              </div>
              <div class="rail-actions">
                <button class="btn btn-secondary" style="width:100%;"><i data-lucide="briefcase"></i>+ Сделка</button>
                <button class="btn btn-secondary" style="width:100%;"><i data-lucide="check-square"></i>+ Задача</button>
                <button class="btn btn-secondary" style="width:100%;"><i data-lucide="file-text"></i>+ КП</button>
                <button class="btn btn-secondary" style="width:100%;"><i data-lucide="message-square"></i>Отправить сообщение</button>
                <button class="btn btn-secondary" style="width:100%;"><i data-lucide="upload"></i>Загрузить файл</button>
              </div>
            </div>
            <!-- Metadata -->
            <div class="card" id="rail-meta"></div>
          </aside>
        </div>

      </div>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/assets/js/relative-date.js"></script>
  <script src="/assets/js/mock-data.js"></script>
  <script src="/assets/js/widgets.js"></script>
  <script src="/assets/js/shell.js"></script>

  <script>
    window.addEventListener('load', function () {
      const MOCK = window.MOCK;
      const CRM  = window.CRM;

      // ─── Time helpers (matching mock-data.js pattern) ─────────────────────
      const _now = Date.now();
      function hr(h)  { return new Date(_now + h * 3600000).toISOString(); }
      function day(d) { return hr(d * 24); }

      // ─── Parse client id from URL ─────────────────────────────────────────
      const params = new URLSearchParams(location.search);
      const clientId = params.get('id') || MOCK.clients[0].id;
      const client = MOCK.clients.find(c => c.id === clientId) || MOCK.clients[0];

      // ─── Helper lookups ───────────────────────────────────────────────────
      function getUser(id) {
        return MOCK.users.find(u => u.id === id) || { name: id, id };
      }

      function firstName(name) {
        const parts = name.split(/\s+/);
        // Russian format: Фамилия Имя → return first name only (index 1) or full if 1 word
        return parts.length >= 2 ? parts[1] : parts[0];
      }

      // ─── Label/badge maps ─────────────────────────────────────────────────
      function typeLabel(t) {
        return { company: 'Юр.лицо', individual: 'Физ.лицо', state: 'Гос.' }[t] || t;
      }
      function typeBadgeSeverity(t) {
        return { company: 'info', individual: 'neutral', state: 'warning' }[t] || 'neutral';
      }
      function statusLabel(s) {
        return { active: 'Активный', prospect: 'Потенциальный', inactive: 'Неактивный' }[s] || s;
      }
      function statusBadgeSeverity(s) {
        return { active: 'success', prospect: 'info', inactive: 'neutral' }[s] || 'neutral';
      }

      const stageMap = {
        new:          { severity: 'info',    label: 'Новая' },
        qualified:    { severity: 'warning', label: 'Квалифицирована' },
        offer_sent:   { severity: 'warning', label: 'КП отправлено' },
        negotiation:  { severity: 'warning', label: 'Переговоры' },
        won:          { severity: 'success', label: 'Выиграна' },
        lost:         { severity: 'danger',  label: 'Проиграна' },
      };

      const offerStatusMap = {
        draft:    { severity: 'neutral', label: 'Черновик' },
        sent:     { severity: 'info',    label: 'Отправлено' },
        viewed:   { severity: 'warning', label: 'Просмотрено' },
        accepted: { severity: 'success', label: 'Принято' },
        rejected: { severity: 'danger',  label: 'Отклонено' },
      };

      const priorityMap = {
        high:   { severity: 'danger',  label: 'Высокий' },
        normal: { severity: 'neutral', label: 'Обычный' },
        low:    { severity: 'info',    label: 'Низкий' },
      };

      const taskStatusMap = {
        new:     { severity: 'info',    label: 'Новая' },
        in_work: { severity: 'warning', label: 'В работе' },
        review:  { severity: 'neutral', label: 'На проверке' },
        done:    { severity: 'success', label: 'Выполнена' },
        overdue: { severity: 'danger',  label: 'Просрочена' },
      };

      function channelIcon(ch) {
        return { telegram: 'send', email: 'mail', whatsapp: 'message-circle', internal: 'message-square' }[ch] || 'message-square';
      }
      function channelLabel(ch) {
        return { telegram: 'Telegram', email: 'Email', whatsapp: 'WhatsApp', internal: 'Внутр.' }[ch] || ch;
      }

      function fileIcon(name) {
        if (name.endsWith('.pdf'))               return 'file-text';
        if (name.endsWith('.docx') || name.endsWith('.doc')) return 'file-text';
        if (name.endsWith('.xlsx') || name.endsWith('.xls')) return 'file-spreadsheet';
        if (/\.(jpg|jpeg|png|gif|webp)$/i.test(name)) return 'file-image';
        return 'file';
      }

      function kindLabel(k) {
        return { note: 'Заметка', status_change: 'Смена статуса', call: 'Звонок', email: 'Email', task_created: 'Создана задача', offer_sent: 'КП отправлено' }[k] || k;
      }
      function kindSeverity(k) {
        return { note: 'neutral', status_change: 'info', call: 'warning', email: 'info', task_created: 'info', offer_sent: 'success' }[k] || 'neutral';
      }

      // ─── Update document title / topbar ──────────────────────────────────
      document.title = client.name + ' · CRM';
      document.body.dataset.title = client.name;
      // Let shell.js pick up the body title if it reads data-title
      const topbarTitle = document.querySelector('[data-shell="topbar"] .topbar-title, .app-topbar .page-title');
      if (topbarTitle) topbarTitle.textContent = client.name;

      // ─── Entity header ────────────────────────────────────────────────────
      document.getElementById('entity-avatar').innerHTML =
        `<span class="avatar avatar-lg" style="background:${CRM.avatarColor(client.name)};flex-shrink:0;">${CRM.initials(client.name)}</span>`;

      document.getElementById('entity-meta').innerHTML =
        `<span class="id-chip">${client.id}</span>` +
        CRM.renderBadge(typeBadgeSeverity(client.type), typeLabel(client.type)) +
        CRM.renderBadge(statusBadgeSeverity(client.status), statusLabel(client.status));

      document.getElementById('entity-name').textContent = client.name;

      document.getElementById('entity-sub').innerHTML =
        `<span><i data-lucide="user"></i>${getUser(client.responsible).name}</span>` +
        `<span><i data-lucide="phone"></i>${client.phone}</span>` +
        `<span><i data-lucide="mail"></i>${client.email}</span>`;

      // ─── Right rail: metadata ─────────────────────────────────────────────
      document.getElementById('rail-meta').innerHTML =
        `<div class="card-head" style="margin-bottom:var(--space-3);"><span class="card-head-title">Метаданные</span></div>` +
        `<dl class="kv-list">` +
          `<dt>Создан</dt><dd>${CRM.formatRelative(client.createdAt)}</dd>` +
          `<dt>Источник</dt><dd>${client.source}</dd>` +
          `<dt>Сегмент</dt><dd>${client.segment}</dd>` +
          `<dt>Активность</dt><dd>${CRM.formatRelative(client.lastActivity)}</dd>` +
          `<dt>Теги</dt><dd><div class="kv-tags">${client.tags.map(t => `<span class="badge badge--neutral badge--flat">${t}</span>`).join('')}</div></dd>` +
        `</dl>`;

      // ─── TAB SYSTEM ───────────────────────────────────────────────────────
      const TABS = [
        { id: 'general',  label: 'Общее' },
        { id: 'contacts', label: 'Контакты' },
        { id: 'deals',    label: 'Сделки' },
        { id: 'offers',   label: 'КП' },
        { id: 'tasks',    label: 'Задачи' },
        { id: 'messages', label: 'Сообщения' },
        { id: 'files',    label: 'Файлы' },
        { id: 'history',  label: 'История' },
      ];

      // Determine initial active tab from hash
      const hashMatch = location.hash.match(/tab=(\w+)/);
      let activeTab = (hashMatch && TABS.find(t => t.id === hashMatch[1])) ? hashMatch[1] : 'general';

      function showTab(id) {
        activeTab = id;
        // Update hash
        history.replaceState(null, '', location.pathname + location.search + '#tab=' + id);
        // Toggle panels
        document.querySelectorAll('[data-tab-panel]').forEach(el => {
          el.style.display = el.dataset.tabPanel === id ? 'block' : 'none';
        });
        // Update tab bar active state
        document.querySelectorAll('#tab-bar .tab').forEach(el => {
          el.classList.toggle('is-active', el.dataset.tab === id);
        });
        if (window.lucide) window.lucide.createIcons();
      }

      CRM.renderTabs('#tab-bar', {
        tabs: TABS,
        activeId: activeTab,
        onChange: showTab,
      });

      // Set initial panel visibility
      document.querySelectorAll('[data-tab-panel]').forEach(el => {
        el.style.display = el.dataset.tabPanel === activeTab ? 'block' : 'none';
      });

      // ─── TAB: Общее ──────────────────────────────────────────────────────
      (function renderGeneral() {
        const leftKv =
          `<dt>ИНН</dt><dd class="num">${client.inn || '—'}</dd>` +
          (client.kpp ? `<dt>КПП</dt><dd class="num">${client.kpp}</dd>` : '') +
          `<dt>Юр. адрес</dt><dd>${client.legalAddress}</dd>` +
          `<dt>Факт. адрес</dt><dd>${client.factAddress}</dd>` +
          `<dt>Тип</dt><dd>${typeLabel(client.type)}</dd>` +
          `<dt>Статус</dt><dd>${CRM.renderBadge(statusBadgeSeverity(client.status), statusLabel(client.status))}</dd>`;

        const rightKv =
          `<dt>Источник</dt><dd>${client.source}</dd>` +
          `<dt>Сегмент</dt><dd>${client.segment}</dd>` +
          `<dt>Сумма сделок</dt><dd class="num" style="font-size:16px;font-weight:600;">${CRM.formatMoney(client.dealsSum)}</dd>` +
          `<dt>Создан</dt><dd>${CRM.formatRelative(client.createdAt)}</dd>` +
          `<dt>Ответственный</dt><dd>${CRM.renderAvatar(getUser(client.responsible).name,'sm')} ${getUser(client.responsible).name.split(' ')[0]}</dd>`;

        document.getElementById('panel-general-kv').innerHTML =
          `<dl class="kv-list">${leftKv}</dl><dl class="kv-list">${rightKv}</dl>`;

        document.getElementById('panel-general-tags').innerHTML =
          `<div class="card-head"><span class="card-head-title">Теги</span></div>` +
          `<div class="kv-tags">${client.tags.map(t => `<span class="badge badge--neutral badge--flat">${t}</span>`).join('')}</div>`;
      }());

      // ─── TAB: Контакты ────────────────────────────────────────────────────
      (function renderContacts() {
        const contacts = MOCK.contacts.filter(c => c.clientId === client.id);
        const root = document.getElementById('panel-contacts');
        root.innerHTML =
          `<div style="padding:20px 24px 12px;">` +
            `<div class="card-head" style="margin-bottom:0;">` +
              `<span class="card-head-title">Контакты</span>` +
              `<span style="display:flex;align-items:center;gap:var(--space-3);">` +
                `<span class="card-head-sub">${contacts.length}</span>` +
                `<button class="btn btn-primary btn-sm"><i data-lucide="plus"></i>Контакт</button>` +
              `</span>` +
            `</div>` +
          `</div>` +
          `<div id="contacts-table-inner"></div>`;

        CRM.renderTable('#contacts-table-inner', {
          columns: [
            {
              key: 'name', label: 'ИМЯ',
              render: r => `<span style="display:inline-flex;align-items:center;gap:8px;">${CRM.renderAvatar(r.name,'sm')}<span><span style="font-size:13px;font-weight:500;">${r.name}</span><br><span style="font-size:12px;color:var(--text-muted);">${r.position}</span></span></span>`
            },
            {
              key: 'position', label: 'ДОЛЖНОСТЬ',
              render: r => `<span class="text-secondary" style="font-size:13px;">${r.position}</span>`
            },
            {
              key: 'phone', label: 'ТЕЛЕФОН',
              render: r => `<span class="num" style="font-size:13px;">${r.phone}</span>`
            },
            {
              key: 'email', label: 'EMAIL',
              render: r => `<span class="text-secondary" style="font-size:13px;">${r.email}</span>`
            },
            {
              key: '_actions', label: '',
              render: r => `<span class="row-actions"><button class="btn btn-ghost btn-icon btn-sm" aria-label="Редактировать"><i data-lucide="edit-2"></i></button><button class="btn btn-ghost btn-icon btn-sm" aria-label="Удалить"><i data-lucide="trash-2"></i></button></span>`
            },
          ],
          rows: contacts,
          empty: {
            title: 'Контактов пока нет',
            body: '<button class="btn btn-primary btn-sm" style="margin-top:12px;"><i data-lucide="plus"></i>Добавить контакт</button>',
          },
        });
      }());

      // ─── TAB: Сделки ─────────────────────────────────────────────────────
      (function renderDeals() {
        const deals = MOCK.deals
          .filter(d => d.clientId === client.id)
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        const root = document.getElementById('panel-deals');
        root.innerHTML =
          `<div style="padding:20px 24px 12px;">` +
            `<div class="card-head" style="margin-bottom:0;">` +
              `<span class="card-head-title">Сделки</span>` +
              `<span style="display:flex;align-items:center;gap:var(--space-3);">` +
                `<span class="card-head-sub">${deals.length}</span>` +
                `<button class="btn btn-primary btn-sm"><i data-lucide="plus"></i>Сделка</button>` +
              `</span>` +
            `</div>` +
          `</div>` +
          `<div id="deals-table-inner"></div>`;

        CRM.renderTable('#deals-table-inner', {
          columns: [
            {
              key: 'number', label: 'НОМЕР',
              render: r => `<span class="id-chip">${r.number}</span>`
            },
            {
              key: 'title', label: 'НАЗВАНИЕ',
              render: r => `<span style="font-size:13px;">${r.title}</span>`
            },
            {
              key: 'stage', label: 'ЭТАП',
              render: r => CRM.renderBadge((stageMap[r.stage]||{severity:'neutral'}).severity, (stageMap[r.stage]||{label:r.stage}).label)
            },
            {
              key: 'amount', label: 'СУММА', numeric: true,
              render: r => `<span class="num" style="font-size:13px;">${CRM.formatMoney(r.amount)}</span>`
            },
            {
              key: 'responsible', label: 'ОТВЕТСТВЕННЫЙ',
              render: r => `<span style="display:inline-flex;align-items:center;gap:6px;">${CRM.renderAvatar(getUser(r.responsible).name,'sm')}<span style="font-size:13px;">${firstName(getUser(r.responsible).name)}</span></span>`
            },
            {
              key: 'lastActionAt', label: 'АКТИВНОСТЬ',
              render: r => `<span style="font-size:13px;color:var(--text-secondary);">${CRM.formatRelative(r.lastActionAt)}</span>`
            },
            {
              key: '_actions', label: '',
              render: r => `<span class="row-actions"><button class="btn btn-ghost btn-icon btn-sm" aria-label="Открыть"><i data-lucide="eye"></i></button><button class="btn btn-ghost btn-icon btn-sm" aria-label="Редактировать"><i data-lucide="edit-2"></i></button></span>`
            },
          ],
          rows: deals,
          empty: { title: 'Сделок пока нет', body: 'Создайте первую сделку для этого клиента.' },
        });
      }());

      // ─── TAB: КП ─────────────────────────────────────────────────────────
      (function renderOffers() {
        const offers = MOCK.offers
          .filter(o => o.clientId === client.id)
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        const root = document.getElementById('panel-offers');
        root.innerHTML =
          `<div style="padding:20px 24px 12px;">` +
            `<div class="card-head" style="margin-bottom:0;">` +
              `<span class="card-head-title">Коммерческие предложения</span>` +
              `<span style="display:flex;align-items:center;gap:var(--space-3);">` +
                `<span class="card-head-sub">${offers.length}</span>` +
                `<button class="btn btn-primary btn-sm"><i data-lucide="plus"></i>КП</button>` +
              `</span>` +
            `</div>` +
          `</div>` +
          `<div id="offers-table-inner"></div>`;

        CRM.renderTable('#offers-table-inner', {
          columns: [
            {
              key: 'number', label: 'НОМЕР',
              render: r => `<span class="id-chip">${r.number}</span>`
            },
            {
              key: 'amount', label: 'СУММА', numeric: true,
              render: r => `<span class="num" style="font-size:13px;">${CRM.formatMoney(r.amount)}</span>`
            },
            {
              key: 'status', label: 'СТАТУС',
              render: r => CRM.renderBadge((offerStatusMap[r.status]||{severity:'neutral'}).severity, (offerStatusMap[r.status]||{label:r.status}).label)
            },
            {
              key: 'createdAt', label: 'СОЗДАНО',
              render: r => `<span style="font-size:13px;color:var(--text-secondary);">${CRM.formatRelative(r.createdAt)}</span>`
            },
            {
              key: 'sentAt', label: 'ОТПРАВЛЕНО',
              render: r => `<span style="font-size:13px;color:var(--text-secondary);">${r.sentAt ? CRM.formatRelative(r.sentAt) : '—'}</span>`
            },
            {
              key: 'viewedAt', label: 'ПРОСМОТРЕНО',
              render: r => `<span style="font-size:13px;color:var(--text-secondary);">${r.viewedAt ? CRM.formatRelative(r.viewedAt) : '—'}</span>`
            },
            {
              key: 'version', label: 'ВЕР.',
              render: r => `<span class="text-muted" style="font-size:13px;">v${r.version}</span>`
            },
            {
              key: '_actions', label: '',
              render: r => `<span class="row-actions"><button class="btn btn-ghost btn-icon btn-sm" aria-label="Просмотр"><i data-lucide="eye"></i></button><button class="btn btn-ghost btn-icon btn-sm" aria-label="Отправить"><i data-lucide="send"></i></button><button class="btn btn-ghost btn-icon btn-sm" aria-label="Скачать"><i data-lucide="download"></i></button></span>`
            },
          ],
          rows: offers,
          empty: { title: 'КП пока нет', body: 'Создайте первое коммерческое предложение для этого клиента.' },
        });
      }());

      // ─── TAB: Задачи ─────────────────────────────────────────────────────
      (function renderTasks() {
        const tasks = MOCK.tasks.filter(t => t.relatedType === 'client' && t.relatedId === client.id);

        const root = document.getElementById('panel-tasks');
        root.innerHTML =
          `<div style="padding:20px 24px 12px;">` +
            `<div class="card-head" style="margin-bottom:0;">` +
              `<span class="card-head-title">Задачи</span>` +
              `<span style="display:flex;align-items:center;gap:var(--space-3);">` +
                `<span class="card-head-sub">${tasks.length}</span>` +
                `<button class="btn btn-primary btn-sm"><i data-lucide="plus"></i>Задача</button>` +
              `</span>` +
            `</div>` +
          `</div>` +
          `<div id="tasks-table-inner"></div>`;

        CRM.renderTable('#tasks-table-inner', {
          columns: [
            {
              key: 'priority', label: 'ПРИОРИТЕТ',
              render: r => CRM.renderBadge((priorityMap[r.priority]||{severity:'neutral'}).severity, (priorityMap[r.priority]||{label:r.priority}).label)
            },
            {
              key: 'title', label: 'ЗАДАЧА',
              render: r => `<span style="font-size:13px;">${r.title}</span>`
            },
            {
              key: 'assignee', label: 'ИСПОЛНИТЕЛЬ',
              render: r => `<span style="display:inline-flex;align-items:center;gap:6px;">${CRM.renderAvatar(getUser(r.assignee).name,'sm')}<span style="font-size:13px;">${firstName(getUser(r.assignee).name)}</span></span>`
            },
            {
              key: 'deadline', label: 'ДЕДЛАЙН',
              render: r => {
                const isOverdue = r.status === 'overdue' || new Date(r.deadline) < new Date();
                const label = CRM.formatRelative(r.deadline);
                return isOverdue && r.status !== 'done'
                  ? CRM.renderBadge('danger', label)
                  : `<span style="font-size:13px;color:var(--text-secondary);">${label}</span>`;
              }
            },
            {
              key: 'status', label: 'СТАТУС',
              render: r => CRM.renderBadge((taskStatusMap[r.status]||{severity:'neutral'}).severity, (taskStatusMap[r.status]||{label:r.status}).label)
            },
            {
              key: '_actions', label: '',
              render: r => `<span class="row-actions"><button class="btn btn-ghost btn-icon btn-sm" aria-label="Выполнить"><i data-lucide="check"></i></button><button class="btn btn-ghost btn-icon btn-sm" aria-label="Редактировать"><i data-lucide="edit-2"></i></button></span>`
            },
          ],
          rows: tasks,
          empty: { title: 'Задач пока нет', body: 'Создайте первую задачу для этого клиента.' },
        });
      }());

      // ─── TAB: Сообщения ───────────────────────────────────────────────────
      (function renderMessages() {
        const msgs = MOCK.messages
          .filter(m => m.clientId === client.id)
          .sort((a, b) => new Date(a.sentAt) - new Date(b.sentAt));

        const root = document.getElementById('panel-messages');

        let feedHtml = '';
        if (msgs.length === 0) {
          feedHtml = `<div class="empty"><h3>Сообщений пока нет</h3></div>`;
        } else {
          feedHtml = `<div class="chat-feed">` + msgs.map(m => {
            const authorName = m.direction === 'out' ? getUser(m.author).name : m.author;
            return `<div class="chat-bubble chat-bubble--${m.direction}">` +
              `<div class="chat-meta">` +
                `<span class="chat-channel chat-channel--${m.channel}"><i data-lucide="${channelIcon(m.channel)}"></i>${channelLabel(m.channel)}</span>` +
                `<span class="chat-author">${authorName}</span>` +
                `<span class="chat-time">${CRM.formatRelative(m.sentAt)}</span>` +
              `</div>` +
              `<div class="chat-text">${m.text}</div>` +
            `</div>`;
          }).join('') + `</div>`;
        }

        root.innerHTML =
          `<div class="card-head"><span class="card-head-title">Переписка</span><span class="card-head-sub">${msgs.length} сообщений</span></div>` +
          feedHtml +
          `<div class="chat-composer">` +
            `<input class="input" placeholder="Написать сообщение…">` +
            `<button class="btn btn-ghost btn-icon" aria-label="Прикрепить файл"><i data-lucide="paperclip"></i></button>` +
            `<button class="btn btn-primary btn-icon" aria-label="Отправить"><i data-lucide="send"></i></button>` +
          `</div>`;
      }());

      // ─── TAB: Файлы ───────────────────────────────────────────────────────
      (function renderFiles() {
        const files = [
          { name: 'Договор поставки 2026-04.pdf', sizeLabel: '1.2 МБ', uploadedAt: hr(-26),  uploadedBy: client.responsible },
          { name: 'Реквизиты.docx',                sizeLabel: '46 КБ',  uploadedAt: day(-8),  uploadedBy: client.responsible },
          { name: 'Спецификация на закупку.xlsx',  sizeLabel: '320 КБ', uploadedAt: day(-12), uploadedBy: client.responsible },
          { name: 'Скан паспорта руководителя.jpg',sizeLabel: '2.4 МБ', uploadedAt: day(-15), uploadedBy: client.responsible },
          { name: 'КП 2026-0041.pdf',              sizeLabel: '480 КБ', uploadedAt: day(-7),  uploadedBy: client.responsible },
          { name: 'Протокол встречи.docx',         sizeLabel: '92 КБ',  uploadedAt: day(-3),  uploadedBy: client.responsible },
        ];

        const root = document.getElementById('panel-files');
        root.innerHTML =
          `<div class="card-head">` +
            `<span class="card-head-title">Файлы</span>` +
            `<span style="display:flex;align-items:center;gap:var(--space-3);">` +
              `<span class="card-head-sub">${files.length}</span>` +
              `<button class="btn btn-secondary btn-sm"><i data-lucide="upload"></i>Загрузить файл</button>` +
            `</span>` +
          `</div>` +
          `<div class="files-grid">` +
            files.map(f =>
              `<article class="file-card">` +
                `<div class="file-icon"><i data-lucide="${fileIcon(f.name)}"></i></div>` +
                `<div class="file-name">${f.name}</div>` +
                `<div class="file-meta"><span>${f.sizeLabel}</span>·<span>${CRM.formatRelative(f.uploadedAt)}</span></div>` +
                `<div class="file-by">${getUser(f.uploadedBy).name}</div>` +
              `</article>`
            ).join('') +
          `</div>`;
      }());

      // ─── TAB: История ─────────────────────────────────────────────────────
      (function renderHistory() {
        const entries = MOCK.activity('client', client.id);

        const root = document.getElementById('panel-history');
        root.innerHTML =
          `<div class="card-head"><span class="card-head-title">История действий</span><span class="card-head-sub">${entries.length} событий</span></div>` +
          `<ol class="timeline">` +
          entries.map(e =>
            `<li class="timeline-item">` +
              `<div class="timeline-dot timeline-dot--${kindSeverity(e.kind)}"></div>` +
              `<div class="timeline-body">` +
                `<div class="timeline-meta">` +
                  `<span class="timeline-kind">${kindLabel(e.kind)}</span>` +
                  `<span class="timeline-actor">${getUser(e.actor).name}</span>` +
                  `<span class="timeline-time">${CRM.formatRelative(e.at)}</span>` +
                `</div>` +
                `<div class="timeline-text">${e.text}</div>` +
              `</div>` +
            `</li>`
          ).join('') +
          `</ol>`;
      }());

      // ─── Final lucide pass ────────────────────────────────────────────────
      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
