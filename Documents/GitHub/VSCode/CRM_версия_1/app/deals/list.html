<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сделки · Таблица · CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    /* Segmented control with anchor links */
    .segmented a {
      border: 0;
      background: transparent;
      padding: 6px 14px;
      font-size: 13px;
      color: var(--text-secondary);
      border-radius: var(--radius-pill);
      transition: background var(--dur-fast) var(--ease-spring), color var(--dur-fast) var(--ease-spring), box-shadow var(--dur-fast) var(--ease-spring);
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }
    .segmented a.is-active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      font-weight: 500;
    }
  </style>
</head>
<body data-route="deals" data-title="Сделки · таблица"
      data-empty-icon="briefcase"
      data-empty-title="Нет сделок"
      data-empty-desc="Создайте первую сделку — она появится здесь и в канбан-доске."
      data-empty-create="deal">
  <div class="app-shell">
    <div data-shell="sidebar"></div>
    <main class="app-main">
      <div data-shell="topbar"></div>
      <div class="app-content">
        <header class="app-header">
          <div>
            <h1 class="h-display h1">Сделки · таблица</h1>
            <p class="text-secondary">22 сделки</p>
          </div>
          <div class="flex items-center" style="gap:8px;">
            <div class="segmented">
              <a href="/app/deals/kanban.html">Канбан</a>
              <a href="/app/deals/list.html" class="is-active">Таблица</a>
              <a href="/app/deals/by-client.html">По клиентам</a>
            </div>
            <button class="btn btn-secondary btn-sm" data-filter="funnel">
              <i data-lucide="layers"></i>Воронка<i data-lucide="chevron-down"></i>
            </button>
            <button class="btn btn-secondary btn-sm" data-filter="direction">
              <i data-lucide="filter"></i>Направление<i data-lucide="chevron-down"></i>
            </button>
            <button class="btn btn-secondary btn-sm" data-filter="responsible">
              <i data-lucide="user"></i>Ответственный<i data-lucide="chevron-down"></i>
            </button>
            <button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="create-deal">
              <i data-lucide="plus"></i>Сделка
            </button>
          </div>
        </header>

        <div class="card-flush">
          <div id="table-root"></div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/assets/js/relative-date.js"></script>
  <script src="/assets/js/mock-data.js"></script>
  <script src="/assets/js/widgets.js"></script>
  <script src="/assets/js/shell.js"></script>

  <script>
    window.addEventListener('load', function () {
      if (window.CRM.checkEmptyState()) return;
      const MOCK = window.MOCK;
      const CRM  = window.CRM;
      const now  = Date.now();
      const STALE_MS = 3 * 86400000; // 3 days

      // ─── helpers ─────────────────────────────────────────────────────────────
      function isStale(deal) {
        return !['won','lost'].includes(deal.stage) && (now - new Date(deal.lastActionAt)) > STALE_MS;
      }

      function staleDays(deal) {
        return Math.round((now - new Date(deal.lastActionAt)) / 86400000);
      }

      function getUserName(id) {
        const u = MOCK.users.find(u => u.id === id);
        return u ? u.name : id;
      }

      function getClient(clientId) {
        return MOCK.clients.find(c => c.id === clientId) || { name: clientId };
      }

      // ─── stage map ───────────────────────────────────────────────────────────
      const stageMap = {
        new:         { variant: 'info',    label: 'Новая' },
        qualified:   { variant: 'warning', label: 'Квалифицирована' },
        offer_sent:  { variant: 'warning', label: 'КП отправлено' },
        negotiation: { variant: 'warning', label: 'Переговоры' },
        won:         { variant: 'success', label: 'Выиграна' },
        lost:        { variant: 'danger',  label: 'Проиграна' },
      };

      // ─── sort: stale first (oldest last action), then rest by createdAt desc; won/lost to bottom of rest ───
      const terminalStages = ['won','lost'];
      const staleDeals  = MOCK.deals.filter(isStale).sort((a, b) => new Date(a.lastActionAt) - new Date(b.lastActionAt));
      const activeDeals = MOCK.deals.filter(d => !isStale(d) && !terminalStages.includes(d.stage)).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const termDeals   = MOCK.deals.filter(d => !isStale(d) && terminalStages.includes(d.stage)).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const rows = [...staleDeals, ...activeDeals, ...termDeals];

      // ─── table ───────────────────────────────────────────────────────────────
      CRM.renderTable('#table-root', {
        columns: [
          {
            key: 'number', label: 'НОМЕР',
            render: r => `<span class="id-chip">${r.number}</span>`
          },
          {
            key: 'title', label: 'НАЗВАНИЕ',
            render: r => {
              const client = getClient(r.clientId);
              return `<span>
                <div style="font-size:14px;font-weight:500;color:var(--text-primary);line-height:1.35;">${r.title}</div>
                <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${client.name}</div>
              </span>`;
            }
          },
          {
            key: 'direction', label: 'НАПРАВЛЕНИЕ',
            render: r => `<span style="font-size:13px;color:var(--text-secondary);">${r.direction}</span>`
          },
          {
            key: 'stage', label: 'ВОРОНКА · ЭТАП',
            render: r => {
              const s = stageMap[r.stage] || { variant: 'neutral', label: r.stage };
              return `<span>
                <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">${r.funnel}</div>
                ${CRM.renderBadge(s.variant, s.label)}
              </span>`;
            }
          },
          {
            key: 'amount', label: 'СУММА', numeric: true,
            render: r => `<span class="num" style="font-size:13px;">${CRM.formatMoney(r.amount)}</span>`
          },
          {
            key: 'responsible', label: 'ОТВЕТСТВЕННЫЙ',
            render: r => {
              const name = getUserName(r.responsible);
              const firstName = name.split(' ').slice(0, 2).join(' ');
              return `<span style="display:inline-flex;align-items:center;gap:6px;">${CRM.renderAvatar(name,'sm')}<span style="font-size:13px;">${firstName}</span></span>`;
            }
          },
          {
            key: 'createdAt', label: 'СОЗДАНА',
            render: r => `<span style="font-size:13px;color:var(--text-secondary);">${CRM.formatRelative(r.createdAt)}</span>`
          },
          {
            key: 'stale', label: 'БЕЗ ДВИЖЕНИЯ',
            render: r => isStale(r)
              ? CRM.renderBadge('danger', `${staleDays(r)} дн`)
              : `<span style="color:var(--text-muted);">—</span>`
          },
          {
            key: '_actions', label: '',
            render: r => `<span class="row-actions">
              <a class="btn btn-ghost btn-icon btn-sm" title="Просмотр" href="/app/deals/card.html?id=${r.id}"><i data-lucide="eye"></i></a>
              <button class="btn btn-ghost btn-icon btn-sm" title="Редактировать"><i data-lucide="pencil"></i></button>
              <button class="btn btn-ghost btn-icon btn-sm" title="Ещё"><i data-lucide="more-vertical"></i></button>
            </span>`
          },
        ],
        rows,
        rowHref: r => `/app/deals/card.html?id=${r.id}`,
        empty: { title: 'Нет сделок', body: 'Добавьте первую сделку или настройте фильтры.' }
      });

      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
