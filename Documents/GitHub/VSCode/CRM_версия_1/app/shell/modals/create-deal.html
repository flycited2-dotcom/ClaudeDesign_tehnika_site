<div class="modal-shell">
  <div class="modal-head">
    <div class="modal-head-title">Новая сделка</div>
    <button class="modal-close" data-modal-close><i data-lucide="x"></i></button>
  </div>
  <div class="modal-body">
    <div class="form-grid">
      <div class="form-row full">
        <label class="form-label">Название сделки</label>
        <input class="input" placeholder="Поставка ...">
      </div>
      <div class="form-row full">
        <label class="form-label">Клиент</label>
        <div class="select-stub"><span>Выбрать клиента</span><i data-lucide="chevron-down"></i></div>
      </div>
      <div class="form-row">
        <label class="form-label">Воронка</label>
        <div class="select-stub"><span>Основная</span><i data-lucide="chevron-down"></i></div>
      </div>
      <div class="form-row">
        <label class="form-label">Направление</label>
        <div class="select-stub"><span>Опт</span><i data-lucide="chevron-down"></i></div>
      </div>
      <div class="form-row">
        <label class="form-label">Сумма, ₽</label>
        <input class="input num" placeholder="0">
      </div>
      <div class="form-row">
        <label class="form-label">Ответственный</label>
        <div class="select-stub"><span>Назначить</span><i data-lucide="chevron-down"></i></div>
      </div>
      <div class="form-row full">
        <label class="form-label">Комментарий</label>
        <input class="input" placeholder="Заметка для команды">
      </div>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn btn-ghost" data-modal-close>Отмена</button>
    <button class="btn btn-primary" data-modal-close>Создать сделку</button>
  </div>
</div>
