<div class="modal-shell">
  <div class="modal-head">
    <div class="modal-head-title">Новый лид</div>
    <button class="modal-close" data-modal-close><i data-lucide="x"></i></button>
  </div>
  <div class="modal-body">
    <div class="form-grid">
      <div class="form-row full">
        <label class="form-label">Название заявки</label>
        <input class="input" placeholder="Запрос на поставку ...">
      </div>
      <div class="form-row full">
        <label class="form-label">Источник</label>
        <div class="select-stub"><span>splihub.ru</span><i data-lucide="chevron-down"></i></div>
      </div>
      <div class="form-row full">
        <label class="form-label">Клиент / организация</label>
        <input class="input" placeholder="ООО «...» или ФИО">
      </div>
      <div class="form-row">
        <label class="form-label">Телефон</label>
        <input class="input" placeholder="+7 ...">
      </div>
      <div class="form-row">
        <label class="form-label">Email</label>
        <input class="input" type="email" placeholder="info@...">
      </div>
      <div class="form-row">
        <label class="form-label">Сумма, ₽</label>
        <input class="input num" placeholder="0">
        <div class="form-hint">Необязательно — оценка на старте</div>
      </div>
      <div class="form-row">
        <label class="form-label">Ответственный</label>
        <div class="select-stub"><span>Назначить менеджера</span><i data-lucide="chevron-down"></i></div>
      </div>
      <div class="form-row full">
        <label class="form-label">Комментарий</label>
        <input class="input" placeholder="Что хочет клиент">
      </div>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn btn-ghost" data-modal-close>Отмена</button>
    <button class="btn btn-primary" data-modal-close>Создать лид</button>
  </div>
</div>
