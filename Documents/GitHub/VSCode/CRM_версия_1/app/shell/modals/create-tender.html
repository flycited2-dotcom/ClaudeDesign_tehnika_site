<div class="modal-shell">
  <div class="modal-head">
    <div class="modal-head-title">Новый тендер</div>
    <button class="modal-close" data-modal-close><i data-lucide="x"></i></button>
  </div>
  <div class="modal-body">
    <div class="form-grid">
      <div class="form-row full">
        <label class="form-label">Название закупки</label>
        <input class="input" placeholder="Поставка ...">
      </div>
      <div class="form-row full">
        <label class="form-label">Заказчик</label>
        <input class="input" placeholder="ГБУЗ / МКУ / АО «...»">
      </div>
      <div class="form-row">
        <label class="form-label">Площадка</label>
        <div class="select-stub"><span>ZakupKi</span><i data-lucide="chevron-down"></i></div>
      </div>
      <div class="form-row">
        <label class="form-label">№ извещения</label>
        <input class="input num" placeholder="0173200001426...">
      </div>
      <div class="form-row">
        <label class="form-label">НМЦ, ₽</label>
        <input class="input num" placeholder="0">
      </div>
      <div class="form-row">
        <label class="form-label">Дедлайн подачи</label>
        <input class="input" type="date">
      </div>
      <div class="form-row full">
        <label class="form-label">Ответственный</label>
        <div class="select-stub"><span>Назначить менеджера</span><i data-lucide="chevron-down"></i></div>
      </div>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn btn-ghost" data-modal-close>Отмена</button>
    <button class="btn btn-primary" data-modal-close>Создать тендер</button>
  </div>
</div>
